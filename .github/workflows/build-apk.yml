name: Build APK

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Адрес сайта, который открывает приложение"
        required: true
        default: "http://91.98.119.91"
      app_id:
        description: "applicationId (как в админке → Приложение)"
        required: true
        default: "am.snp.shop"
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_URL: ${{ github.event.inputs.base_url || vars.BYME_BASE_URL || 'http://91.98.119.91' }}
      APP_ID: ${{ github.event.inputs.app_id || vars.BYME_APP_ID || 'am.snp.shop' }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Подпись: ключ из секретов репозитория (один и тот же ключ — иначе обновления не установятся поверх)
      - name: Keystore
        env:
          KS_B64: ${{ secrets.BYME_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/byme.jks"
            echo "BYME_KEYSTORE=$RUNNER_TEMP/byme.jks" >> "$GITHUB_ENV"
            echo "Подпись: ключ BYME из секретов"
          else
            echo "::warning::Секрет BYME_KEYSTORE_BASE64 не задан — APK подписан временным debug-ключом (обновления поверх могут не установиться)"
          fi

      - name: Build
        env:
          BYME_KEYSTORE_PASSWORD: ${{ secrets.BYME_KEYSTORE_PASSWORD }}
          BYME_KEY_ALIAS: ${{ secrets.BYME_KEY_ALIAS }}
          BYME_KEY_PASSWORD: ${{ secrets.BYME_KEY_PASSWORD }}
        run: |
          gradle :app:assembleRelease --no-daemon --stacktrace \
            -PbymeBaseUrl="$BASE_URL" -PbymeAppId="$APP_ID" \
            -PbymeVersionCode=${{ github.run_number }} -PbymeVersionName="$VERSION_NAME"
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/BYME-$VERSION_NAME.apk"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: BYME-${{ env.VERSION_NAME }}
          path: out/*.apk
          retention-days: 30

      # Прямая ссылка на .apk: вкладка Releases репозитория
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: BYME.AM ${{ env.VERSION_NAME }}
          body: "Сайт: ${{ env.BASE_URL }} · applicationId: ${{ env.APP_ID }}"
          files: out/*.apk
